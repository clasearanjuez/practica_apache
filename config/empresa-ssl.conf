<VirtualHost *:443>
    ServerName empresa.local
    DocumentRoot /var/www/empresa/

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/empresa.crt
    SSLCertificateKeyFile /etc/ssl/private/empresa.key

    <Directory /var/www/empresa/>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/empresa-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/empresa-ssl-access.log combined
</VirtualHost>
