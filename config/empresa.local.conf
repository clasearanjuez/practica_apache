<VirtualHost *:80>
    ServerName empresa.local
    ServerAlias www.empresa.local
    DocumentRoot /var/www/empresa/

    <Directory /var/www/empresa/>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/empresa/admin>
        AuthType Basic
        AuthName "Zona Administrativa"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/empresa-error.log
    CustomLog ${APACHE_LOG_DIR}/empresa-access.log combined
</VirtualHost>
