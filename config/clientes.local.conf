<VirtualHost *:80>
    ServerName clientes.local
    DocumentRoot /var/www/clientes/

    <Directory /var/www/clientes/>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/clientes-error.log
    CustomLog ${APACHE_LOG_DIR}/clientes-access.log combined
</VirtualHost>
